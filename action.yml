name: PostgreSQL Zero Downtime Guard
description: Static safety gate for PostgreSQL migration files.
author: open-source
inputs:
  path:
    description: Directory or file glob containing SQL migrations.
    required: false
    default: migrations
  fail-on-warning:
    description: Fail when any safety rule is violated.
    required: false
    default: 'true'
runs:
  using: node20
  main: src/analyzer.js
branding:
  icon: shield
  color: blue
