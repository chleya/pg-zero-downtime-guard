name: PG Zero Downtime Guard Self-Test

on:
  workflow_dispatch:

jobs:
  guard-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create test migrations
        run: |
          mkdir -p migrations
          cat > migrations/001_add_users.sql <<'SQL'
          CREATE INDEX idx_users_email ON users(email);
          ALTER TABLE users ADD COLUMN created_at TIMESTAMPTZ DEFAULT now();
          SQL
      - name: Run Guard
        uses: chleya/pg-zero-downtime-guard@main
        with:
          path: migrations
          fail-on-warning: 'false'
